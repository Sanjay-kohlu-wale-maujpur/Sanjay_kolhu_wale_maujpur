<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artisan Goods | Official Store</title>
  <style>
    :root {
      --primary: #111827;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--primary);
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hero {
      text-align: center;
      padding: 4rem 1.5rem 3rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
    }

    .main-container {
      max-width: 1100px;
      margin: 2.5rem auto 4rem;
      padding: 0 1.5rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .product-details {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .add-to-cart-btn {
      margin-top: auto;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }

    .add-to-cart-btn:hover {
      background: #374151;
    }

    /* Slide-out Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-cart {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .cart-item-meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .remove-btn {
      color: #ef4444;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .cart-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: #f9fafb;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      background: #16a34a;
      color: #fff;
      text-align: center;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .checkout-btn:hover {
      background: #15803d;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 99;
      display: none;
    }

    .overlay.open {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">My Shop</div>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>Handcrafted Essentials</h1>
    <p>Discover our curated collection of everyday pieces made with care and intention.</p>
  </section>

  <main class="main-container">
    <h2 class="section-title">Featured Products</h2>
    <div class="product-grid" id="product-grid"></div>
  </main>

  <!-- Cart Overlay & Drawer -->
  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-cart" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: var(--muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
    </div>
  </aside>

  <script>
    // 1. Put your products here
    const products = [
      {
        id: 1,
        name: "Black mustard oil 1L",
        price: 195.00,
        image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 2,
        name: "Ceramic Coffee Mug",
        price: 18.00,
        image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 3,
        name: "Minimalist Notebook",
        price: 12.50,
        image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500&auto=format&fit=crop&q=60"
      },
      {
        id: 4,
        name: "Soy Wax Candle",
        price: 20.00,
        image: "https://images.unsplash.com/photo-1603006905003-be475563bc59?w=500&auto=format&fit=crop&q=60"
      }
    ];

    // 2. Set your phone number for orders (international format without + or spaces)
    const WHATSAPP_NUMBER = "918766268507"; 

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = products.map(item => `
        <article class="product-card">
          <img src="${item.image}" alt="${item.name}" class="product-img" loading="lazy">
          <div class="product-details">
            <h3 class="product-name">${item.name}</h3>
            <div class="product-price">$${item.price.toFixed(2)}</div>
            <button class="add-to-cart-btn" onclick="addToCart(${item.id})">Add to Cart</button>
          </div>
        </article>
      `).join("");
    }

    function toggleCart() {
      document.getElementById("cart-drawer").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
      // Auto open cart drawer
      document.getElementById("cart-drawer").classList.add("open");
      document.getElementById("overlay").classList.add("open");
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      const countEl = document.getElementById("cart-count");
      const itemsContainer = document.getElementById("cart-items");
      const totalEl = document.getElementById("cart-total");

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      countEl.textContent = totalItems;

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p style="color: var(--muted); text-align: center; margin-top: 2rem;">Your cart is empty.</p>`;
        totalEl.textContent = "$0.00";
        return;
      }

      let totalPrice = 0;
      itemsContainer.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.qty;
        totalPrice += itemTotal;
        return `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-meta">$${item.price.toFixed(2)} × ${item.qty}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <strong>$${itemTotal.toFixed(2)}</strong>
              <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
            </div>
          </div>
        `;
      }).join("");

      totalEl.textContent = `$${totalPrice.toFixed(2)}`;
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let orderText = "Hello! I'd like to place an order:%0A%0A";
      let total = 0;

      cart.forEach((item, index) => {
        const lineTotal = item.price * item.qty;
        total += lineTotal;
        orderText += `${index + 1}. ${item.name} (x${item.qty}) - $${lineTotal.toFixed(2)}%0A`;
      });

      orderText += `%0A*Total: $${total.toFixed(2)}*`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${orderText}`;
      window.open(url, "_blank");
    }

    // Render products on page load
    renderProducts();
  </script>
</body>
</html>
